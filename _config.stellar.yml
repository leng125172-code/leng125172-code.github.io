leftbar:
  brand:
    style: regular
    image:
      src: /images/avatar.png
      variant: avatar
    name: Miracle 的技术手记
    tagline: 把想法做成工具，把实践写成记录。
    href: /
    search: true
  menu_columns: 2
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
    - id: projects
      title: 项目
      icon: default:documents
      url: /projects/
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
  footer:
    actions:
      - type: link
        title: GitHub
        icon: default:link
        url: https://github.com/leng125172-code
      - type: link
        title: RSS
        icon: default:documents
        url: /atom.xml
      - type: link
        title: 显示设置
        icon: default:settings
        url: /settings/
appearance:
  preset: card
  color_scheme: auto
  colors:
    primary: '#7387d8'
    accent: '#c384b5'
    link: '#4778bc'
  backgrounds:
    leftbar:
      type: image
      image: /images/anime-skyline.png
      opacity: 0.85
      backdrop:
        radius: 10px
  code_block:
    highlight_stylesheet: null
article:
  style: tech
  listing:
    card_layout: hero
    cover_ratio: 2
    excerpt_length: 140
    show_tags: true
  footer:
    license: false
    share: []
profiles:
  post:
    rightbar:
      widgets: [toc]
  page:
    rightbar:
      widgets: [toc]
  wiki_index:
    path: null
  notebooks:
    path: null
  error:
    image: /images/favicon.svg
features:
  color_scheme_switch:
    enabled: true
  card_hover:
    spotlight: true
    tilt: false
  reveal:
    enabled: true
    duration: 400
    interval: 80
    distance: 6
    blur: 0
  lightbox:
    enabled: false
  link_prefetch:
    enabled: false
search:
  provider: local
footer:
  content: |
    © 2026 Miracle · 把想法做成工具，把实践写成记录。
    使用 [Hexo](https://hexo.io/) 与 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 构建。
fallbacks:
  avatar: /images/avatar.png
  cover: /images/covers/hello-miracle.png
  link_card: /images/favicon.svg
inject:
  head_end: '<link rel="stylesheet" href="/css/custom.css?v=stellar-1">'
  body_end: '<script src="/js/atmosphere.js" defer></script>'
